<main class="shell document"><h1>台灣 e-GNSS</h1>
<p>國土測繪中心提供的衛星定位服務，可作為網路 RTK 的台灣例子。</p>
<p>以虛擬基準站即時動態定位（VBS-RTK）服務為例，系統根據使用者的大致位置回傳虛擬基準站的觀測資料，移動站再利用這些資料解算測點坐標。可用這個例子理解 <a href="rtk.html">RTK</a> 的參考資料也能來自一個基準站網路。</p>
<p>服務設定、申請、費用、坐標系統與適用條件請查閱<a href="https://egnss.nlsc.gov.tw/">國土測繪中心 e-GNSS 入口</a>。</p>

<main class="shell document"><h1>GNSS-05 Ellipsoidal and Cartesian Coordinates Conversion</h1>
<p>同一點可用 ECEF 的三個笛卡兒坐標或參考橢球的緯度、經度與橢球高表示。經度由 X、Y 取向，緯度與高度須使用橢球模型。</p>
<h2>適用範圍</h2>
<p>搭配與 ECEF 參考框架相容的橢球。橢球高有自己的參考面。</p>

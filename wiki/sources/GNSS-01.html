<main class="shell document"><h1>GNSS-01 GPS Navigation Message</h1>
<p>導航電文含廣播星曆、衛星鐘差參數、健康狀態和其他資料。星曆用於算單顆衛星位置，曆書用較粗略的資訊協助搜尋衛星。</p>
<h2>適用範圍</h2>
<p>課程使用 GPS 電文共同概念。不同訊號的訊息格式各異。</p>
<h2>原文定位</h2>

<main class="shell document"><h1>GNSS-03 GNSS Basic Observables</h1>
<p>碼觀測把接收機與衛星時鐘標記的時間差換成距離。方程包含幾何距離、兩端鐘差、電離層與對流層、儀器延遲、多路徑與雜訊。</p>
<h2>適用範圍</h2>
<p>這裡使用以公尺表示的碼觀測。不同頻率的電離層項不同，載波相位的符號與額外項也不同。</p>
<h2>原文定位</h2>
<p>Pseudorange，兩條虛擬距離公式。<a href="https://gssc.esa.int/navipedia/index.php/GNSS_Basic_Observables#Pseudorange">開啟原文</a> · <a href="../../raw/GNSS-03.html">來源記錄</a></p>

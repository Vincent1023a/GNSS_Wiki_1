<main class="shell document"><h1>GNSS-04 Code Based Positioning (SPS)</h1>
<p>單系統碼定位以每顆衛星的虛擬距離作一條觀測方程，解三個接收機坐標和一個接收機鐘差。超過四筆時可組成超定系統。</p>
<h2>適用範圍</h2>
<p>假定同一時刻、一個系統時標、衛星位置已知且觀測幾何足以約束未知數。</p>
<h2>原文定位</h2>
<p>開頭兩段；式 (1)–(6)，觀測模型、線性化與設計矩陣。<a href="https://gssc.esa.int/navipedia/index.php/Code_Based_Positioning_%28SPS%29">開啟原文</a> · <a href="../../raw/GNSS-04.html">來源記錄</a></p>
